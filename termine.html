  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<div id="site-header"></div>


<div class="page-hero">
  <img src="images/general/about.jpg" alt="Trachtenkapelle" />

    <div class="hero-eyebrow">Kalender</div>

  </div>
</div>

    <div class="stat-item"><div class="stat-number">50+</div><div class="stat-label">Aktive Mitglieder</div></div>
