name: Termine synchronisieren
on:
  # Automatisch täglich um 06:00 UTC (= 07:00 MEZ / 08:00 MESZ)
  schedule:
    - cron: '0 6 * * *'
  # Manuell aus dem GitHub-Interface auslösbar
  workflow_dispatch:
  # Bei jedem Push auf main wenn relevante Dateien geändert wurden
  push:
    branches:
      - main
    paths:
      - 'data/termine.csv'
      - 'Termine/**'
      - 'python_scripts/download_termine_csv.py'
      - 'python_scripts/sync_termine_from_csv.py'
      - 'python_scripts/build_termine.py'

jobs:
  sync:
    name: Sync & Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Lädt die aktuelle Tabelle aus Google Sheets als data/termine.csv
      - name: Termine-CSV aus Google Sheets laden
        run: python3 python_scripts/download_termine_csv.py

      # Liest data/termine.csv und schreibt Termine/*/meta.json
      - name: Termine aus CSV synchronisieren
        run: python3 python_scripts/sync_termine_from_csv.py --file data/termine.csv

      # Scannt Termine/-Ordner und schreibt Termine/index.json
      - name: Termine index bauen
        run: python3 python_scripts/build_termine.py

      # Alle generierten Dateien ins Repo committen
      - name: Geänderte Dateien committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/termine.csv Termine/
          if git diff --staged --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "chore: Termine aktualisiert [skip ci]"
            git push origin main
          fi
